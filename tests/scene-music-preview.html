<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>場景配樂試聽與輸出檢查</title><style>body{max-width:760px;margin:36px auto;font:18px system-ui;background:#162337;color:#eef6ff}button,select{font:inherit;padding:12px;margin:8px}audio{display:block;width:100%;margin:24px 0}a{color:#a5efff}output{display:block;white-space:pre-wrap}</style><h1>場景配樂試聽</h1><p>使用遊戲相同的配器與音訊處理，輸出 18 秒試聽片段。遊戲中的樂曲會持續分段變奏。</p><label>場景 <select id="scene"></select></label><button id="render">製作試聽</button><output id="result" role="status">選擇場景後製作試聽。</output><audio controls id="sample"></audio><a id="download" hidden>下載試聽 WAV</a><script src="../game-polish.js"></script><script src="../scene-music.js"></script><script src="../audio-manager.js"></script><script>
const select=document.getElementById('scene');for(const t of Object.values(SceneMusic.themes)){const o=document.createElement('option');o.value=t.key;o.textContent=t.name;select.append(o);}
document.getElementById('render').onclick=async()=>{
 const button=document.getElementById('render'),out=document.getElementById('result');button.disabled=true;out.textContent='正在輸出遊戲原始音訊…';
 try{
 const ctx=new OfflineAudioContext(2,22050*18,22050),m=new AudioManager();m.ctx=ctx;m.volumeSettings={master:1,music:1,effects:1};m.buildAudioGraph();const gain=ctx.createGain();gain.gain.setValueAtTime(0,0);gain.gain.linearRampToValueAtTime(1,1.1);gain.gain.setValueAtTime(1,15.5);gain.gain.linearRampToValueAtTime(0,17);gain.connect(m.bgmGain);const bus={gain,voices:new Set(),retired:false,offline:true},theme=SceneMusic.themes[select.value];let when=.04,step=0;while(when<15.5){const p=SceneMusic.events(theme,step++);for(const e of p.events)m.playScoreTone(e,when,bus);when+=p.stepSeconds;}
 const buffer=await ctx.startRendering(),bytes=new ArrayBuffer(44+buffer.length*4),v=new DataView(bytes),str=(off,s)=>{for(let i=0;i<s.length;i++)v.setUint8(off+i,s.charCodeAt(i));};str(0,'RIFF');v.setUint32(4,bytes.byteLength-8,true);str(8,'WAVE');str(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,2,true);v.setUint32(24,22050,true);v.setUint32(28,88200,true);v.setUint16(32,4,true);v.setUint16(34,16,true);str(36,'data');v.setUint32(40,bytes.byteLength-44,true);let peak=0,sum=0,clipped=0;for(let i=0;i<buffer.length;i++)for(let c=0;c<2;c++){const value=buffer.getChannelData(c)[i];peak=Math.max(peak,Math.abs(value));sum+=value*value;if(Math.abs(value)>=1)clipped++;v.setInt16(44+(i*2+c)*2,Math.max(-32768,Math.min(32767,Math.round(value*32767))),true);}
 const array=new Uint8Array(bytes);let binary='';for(let i=0;i<array.length;i+=8192)binary+=String.fromCharCode(...array.subarray(i,i+8192));const url='data:audio/wav;base64,'+btoa(binary);document.getElementById('sample').src=url;const link=document.getElementById('download');link.href=url;link.download=theme.key+'-music.wav';link.hidden=false;out.textContent=theme.name+'\n'+theme.style+'\n峰值 '+peak.toFixed(4)+' · RMS '+Math.sqrt(sum/(buffer.length*2)).toFixed(4)+' · 削波樣本 '+clipped+' · 18 秒';
 }catch(e){out.textContent='輸出失敗：'+e.message;}finally{button.disabled=false;}
};</script></html>
