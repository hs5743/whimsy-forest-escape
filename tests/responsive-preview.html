<!doctype html><html lang="zh-TW"><meta charset="utf-8"><title>遊戲響應式檢查</title><style>html,body{margin:0;background:#17232a;color:#f5ecd6;font-family:system-ui}header{height:44px;display:flex;align-items:center;gap:12px;padding:0 12px;box-sizing:border-box}iframe{display:block;border:0;width:390px;height:844px;}select{min-height:32px}</style><header><label for="testViewport">檢查尺寸</label><select id="testViewport"><option value="390,844">手機 390 × 844</option><option value="768,1024">平板 768 × 1024</option><option value="1024,768">平板 1024 × 768</option><option value="1280,720">桌機 1280 × 720</option></select></header><iframe id="gameFrame" title="遊戲預覽" src="../index.html?dev=1"></iframe><script>document.getElementById('testViewport').addEventListener('change',e=>{const [w,h]=e.target.value.split(',');const frame=document.getElementById('gameFrame');frame.style.width=w+'px';frame.style.height=h+'px';});</script></html>
